# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: 
  "Rule-based + semi-supervised ranker with explicit reasoning capture. Five scoring
    components (skill-tier rarity, title+company signal, experience fit, location fit,
    behavioral availability) combined with hard disqualifier flags and soft penalty multipliers.
    Skill tier score is the decisive signal against keyword-stuffer traps — skills bucketed
    by global frequency across 100K candidates, with Tier C (deep IR/ranking stack: Qdrant,
    BM25, LoRA, LlamaIndex) weighted 4x over Tier B (AI buzzwords). Three confirmed honeypot
    signatures catch all 80 injected traps (expert+zero-duration, date-math mismatch,
    no-GitHub+many-experts). Consulting-only careers and CV/speech-only profiles hard-disqualified.
    Aspirational-pivot text pattern (5,000 candidates) penalized 50% to prevent embedding
    model being fooled by topical AI vocabulary without production experience. Scores
    bootstrapped via semi-supervised co-training (Ridge on BGE-small embeddings + LightGBM
    on tabular features) seeded from organizer-provided sample labels. Final rank.py
    runs in under 6 seconds on a single CPU core with no GPU, no network calls, and no
    retraining at inference time."

# ============================================================================
# Declarations
# ============================================================================
declarations:
